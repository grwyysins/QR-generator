<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>QR Code Generator</h1>

        <p>Enter text or a URL to create your QR code.</p>

        <form method="POST">

            <input
                type="text"
                name="data"
                placeholder="Enter text or URL"
                required
            >

            <button type="submit">
                Generate QR Code
            </button>

        </form>


        {% if qr_image %}

            <div class="qr-section">

                <h2>Your QR Code</h2>
                <img
    src="/qr"
    alt="QR Code"
>


            </div>

        {% endif %}

    </div>

</body>

</html>
